<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM3D Web Service</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f; color: #e0e0e0;
    min-height: 100vh;
  }
  header {
    background: #1a1a2e; padding: 16px 24px;
    border-bottom: 1px solid #333;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header .badge {
    background: #16213e; color: #7fdbca; font-size: 11px;
    padding: 3px 8px; border-radius: 4px; font-family: monospace;
  }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

  /* Upload area */
  .upload-area {
    border: 2px dashed #444; border-radius: 12px;
    padding: 40px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 24px;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: #7fdbca; background: #1a1a2e;
  }
  .upload-area input { display: none; }
  .upload-area p { color: #888; margin-top: 8px; }

  /* Controls bar */
  .controls {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  button {
    padding: 10px 20px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all 0.2s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #7fdbca; color: #0f0f0f; }
  .btn-primary:hover:not(:disabled) { background: #5fc4ae; }
  .btn-secondary { background: #333; color: #e0e0e0; }
  .btn-secondary:hover:not(:disabled) { background: #444; }

  /* TRELLIS toggle */
  .trellis-toggle {
    display: flex; align-items: center; gap: 8px;
    background: #1a1a2e; padding: 6px 12px; border-radius: 8px;
  }
  .trellis-toggle label { font-size: 13px; color: #888; }
  .trellis-toggle select {
    background: #16213e; color: #7fdbca; border: 1px solid #333;
    padding: 6px 10px; border-radius: 4px; font-size: 13px;
  }

  /* Main workspace */
  .workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; }
  }

  .panel {
    background: #1a1a2e; border-radius: 12px;
    overflow: hidden; position: relative;
    min-height: 400px;
  }
  .panel-header {
    padding: 12px 16px; background: #16213e;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }

  /* Image canvas */
  .image-panel { position: relative; }
  .image-panel canvas {
    display: block; width: 100%; cursor: crosshair;
  }

  /* Mask list */
  .mask-list {
    padding: 12px; max-height: 160px; overflow-y: auto;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .mask-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 6px;
    background: #222; cursor: pointer; font-size: 13px;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .mask-chip:hover { background: #333; }
  .mask-chip.active { border-color: #7fdbca; }
  .mask-chip .dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .mask-chip .status {
    font-size: 11px; color: #888; margin-left: 4px;
  }

  /* 3D Viewer */
  #viewer-container {
    width: 100%; height: 100%; min-height: 400px;
    display: flex; align-items: center; justify-content: center;
  }
  #viewer-container canvas { display: block; width: 100%; height: 100%; }
  #viewer-placeholder {
    text-align: center; color: #555; padding: 40px;
  }
  #viewer-placeholder p { margin-top: 8px; font-size: 13px; }

  /* Spinner */
  .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 3px solid #333; border-top-color: #7fdbca;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Status bar */
  .status-bar {
    margin-top: 16px; padding: 12px 16px;
    background: #1a1a2e; border-radius: 8px;
    font-size: 13px; color: #888;
    min-height: 44px; display: flex; align-items: center; gap: 12px;
  }
  .status-bar.error { color: #ff6b6b; }
  .status-bar.success { color: #7fdbca; }
</style>
</head>
<body>

<header>
  <h1>SAM3D Web Service</h1>
  <span class="badge">GenesisVIGA</span>
</header>

<div class="container">
  <!-- Upload -->
  <div class="upload-area" id="upload-area">
    <input type="file" id="file-input" accept="image/*">
    <strong>Drop an image here or click to upload</strong>
    <p>Supports PNG, JPG, WEBP</p>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-primary" id="btn-segment" disabled>Segment Image</button>
    <div class="trellis-toggle">
      <label>Reconstruction:</label>
      <select id="trellis-select">
        <option value="1">Coarse (TRELLIS 1)</option>
        <option value="2">Fine (TRELLIS 2)</option>
      </select>
    </div>
    <span id="controls-hint" style="font-size:12px; color:#555;">Upload an image to start</span>
  </div>

  <!-- Workspace -->
  <div class="workspace">
    <!-- Left: Image + masks -->
    <div>
      <div class="panel image-panel">
        <div class="panel-header">
          <span>Input Image</span>
          <span id="image-dims" style="color:#555; font-size:11px;"></span>
        </div>
        <canvas id="image-canvas"></canvas>
      </div>
      <div class="mask-list" id="mask-list"></div>
    </div>

    <!-- Right: 3D viewer -->
    <div class="panel">
      <div class="panel-header">
        <span>3D Viewer</span>
        <span id="viewer-label" style="color:#555; font-size:11px;"></span>
      </div>
      <div id="viewer-container">
        <div id="viewer-placeholder">
          <svg width="48" height="48" fill="none" stroke="#555" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
          <p>Click a mask to generate its 3D model</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar" id="status-bar">Ready</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let jobId = null;
let masks = [];
let overlayImg = null;
let originalImg = null;
let maskMapData = null;  // Uint8Array from mask_map.png
let maskMapW = 0, maskMapH = 0;
let activeMaskId = null;

// Three.js
let scene, camera, renderer, controls, currentModel = null;
let animId = null;

const canvas = document.getElementById('image-canvas');
const ctx = canvas.getContext('2d');

// ---------------------------------------------------------------
// Upload
// ---------------------------------------------------------------
const uploadArea = document.getElementById('upload-area');
const fileInput = document.getElementById('file-input');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault(); uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

async function handleFile(file) {
  setStatus('Uploading...', '');
  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Upload failed');

    jobId = data.job_id;
    setStatus(`Uploaded — Job ${jobId}`, 'success');
    document.getElementById('btn-segment').disabled = false;
    document.getElementById('controls-hint').textContent = 'Click "Segment Image" to detect objects';

    // Show image on canvas
    const img = new Image();
    img.onload = () => {
      originalImg = img;
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      document.getElementById('image-dims').textContent = `${img.width} x ${img.height}`;
    };
    img.src = URL.createObjectURL(file);
  } catch (e) {
    setStatus(`Upload error: ${e.message}`, 'error');
  }
}

// ---------------------------------------------------------------
// Segment
// ---------------------------------------------------------------
document.getElementById('btn-segment').addEventListener('click', async () => {
  if (!jobId) return;
  const btn = document.getElementById('btn-segment');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Segmenting...';
  setStatus('Running SAM segmentation... This may take 1-2 minutes.', '');

  try {
    const res = await fetch(`/api/segment/${jobId}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Segmentation failed');

    masks = data.masks;
    setStatus(`Found ${masks.length} objects`, 'success');
    document.getElementById('controls-hint').textContent = 'Click a mask to reconstruct it in 3D';

    // Load overlay
    const ovImg = new Image();
    ovImg.onload = () => {
      overlayImg = ovImg;
      canvas.width = ovImg.width;
      canvas.height = ovImg.height;
      ctx.drawImage(ovImg, 0, 0);
    };
    ovImg.src = data.overlay + '?t=' + Date.now();

    // Load mask map for click detection
    loadMaskMap();

    // Render mask chips
    renderMaskList();
  } catch (e) {
    setStatus(`Segmentation error: ${e.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Segment Image';
  }
});

function loadMaskMap() {
  const img = new Image();
  img.onload = () => {
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = img.width; tmpCanvas.height = img.height;
    const tmpCtx = tmpCanvas.getContext('2d');
    tmpCtx.drawImage(img, 0, 0);
    const idata = tmpCtx.getImageData(0, 0, img.width, img.height);
    // Red channel = mask_id + 1 (0 = background)
    maskMapData = new Uint8Array(img.width * img.height);
    for (let i = 0; i < maskMapData.length; i++) {
      maskMapData[i] = idata.data[i * 4];  // R channel of grayscale
    }
    maskMapW = img.width;
    maskMapH = img.height;
  };
  img.src = `/api/files/${jobId}/mask_map.png?t=` + Date.now();
}

function renderMaskList() {
  const list = document.getElementById('mask-list');
  list.innerHTML = '';
  masks.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'mask-chip';
    chip.dataset.id = m.id;
    chip.innerHTML = `
      <span class="dot" style="background:rgb(${m.color.join(',')})"></span>
      <span>${m.name}</span>
      <span class="status" id="mask-status-${m.id}"></span>
    `;
    chip.addEventListener('click', () => onMaskClick(m.id));
    list.appendChild(chip);
  });
}

// ---------------------------------------------------------------
// Canvas click → mask detection
// ---------------------------------------------------------------
canvas.addEventListener('click', e => {
  if (!maskMapData) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = Math.floor((e.clientX - rect.left) * scaleX);
  const py = Math.floor((e.clientY - rect.top) * scaleY);

  if (px < 0 || py < 0 || px >= maskMapW || py >= maskMapH) return;
  const val = maskMapData[py * maskMapW + px];
  const maskId = val - 1;  // 0 = background → -1
  if (maskId >= 0 && maskId < masks.length) {
    onMaskClick(maskId);
  }
});

// ---------------------------------------------------------------
// Reconstruct on mask click
// ---------------------------------------------------------------
async function onMaskClick(maskId) {
  // Highlight chip
  document.querySelectorAll('.mask-chip').forEach(c => c.classList.remove('active'));
  const chip = document.querySelector(`.mask-chip[data-id="${maskId}"]`);
  if (chip) chip.classList.add('active');

  activeMaskId = maskId;
  const m = masks[maskId];
  const trellis = document.getElementById('trellis-select').value;
  const statusEl = document.getElementById(`mask-status-${maskId}`);

  // Check if already has GLB
  if (m._glbUrl) {
    loadGLB(m._glbUrl, m.name);
    return;
  }

  setStatus(`Reconstructing "${m.name}" with TRELLIS ${trellis}...`, '');
  if (statusEl) statusEl.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span>';

  try {
    const res = await fetch(`/api/reconstruct/${jobId}/${maskId}?trellis=${trellis}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Reconstruction failed');

    m._glbUrl = data.glb;
    if (statusEl) statusEl.textContent = 'done';
    setStatus(`"${m.name}" reconstructed`, 'success');
    loadGLB(data.glb, m.name);
  } catch (e) {
    if (statusEl) statusEl.textContent = 'error';
    setStatus(`Reconstruction error: ${e.message}`, 'error');
  }
}

// ---------------------------------------------------------------
// Three.js Viewer
// ---------------------------------------------------------------
function initViewer() {
  const container = document.getElementById('viewer-container');
  document.getElementById('viewer-placeholder').style.display = 'none';

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 100);
  camera.position.set(0, 1, 3);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 4;

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(3, 5, 3);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
  dir2.position.set(-3, 2, -3);
  scene.add(dir2);

  // Grid
  const grid = new THREE.GridHelper(4, 20, 0x333333, 0x222222);
  scene.add(grid);

  function animate() {
    animId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Resize
  const ro = new ResizeObserver(() => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
  ro.observe(container);
}

function loadGLB(url, name) {
  if (!scene) initViewer();

  // Remove old model
  if (currentModel) {
    scene.remove(currentModel);
    currentModel.traverse(child => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
        else child.material.dispose();
      }
    });
  }

  document.getElementById('viewer-label').textContent = `Loading ${name}...`;

  const loader = new GLTFLoader();
  loader.load(url, gltf => {
    const model = gltf.scene;

    // Center and scale to fit view
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.0 / maxDim;
    model.scale.setScalar(scale);
    model.position.sub(center.multiplyScalar(scale));

    scene.add(model);
    currentModel = model;
    document.getElementById('viewer-label').textContent = name;

    // Reset camera
    camera.position.set(0, 1, 3);
    controls.target.set(0, 0, 0);
    controls.update();
  }, undefined, err => {
    document.getElementById('viewer-label').textContent = 'Load error';
    console.error('GLB load error:', err);
  });
}

// ---------------------------------------------------------------
// Status helpers
// ---------------------------------------------------------------
function setStatus(msg, type) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.className = 'status-bar' + (type ? ` ${type}` : '');
}
</script>
</body>
</html>
